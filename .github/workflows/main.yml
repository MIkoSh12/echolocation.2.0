name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: echolocation/echolocation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0
      - name: Build
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: echolocation-jar
          path: echolocation/echolocation/build/libs/*.jar
